name: discrete
schedule:
  mode: greedy
options:
  lambda_u: 1.0e-08
  lambda_d: 1.0e-07
  mu: 0.0001
  pool: 8
  update_pool: ${branch.options.pool}
  window: ${oc.select:benchmark.methods.discrete.window,1}
  group_pool: 1
  max_group: 16
  parameters: null
  canonicalization: true
  likelihood: auto
  variance: 1.0
  fisher_n: ${oc.select:benchmark.fisher_n,null}
  fisher_seed: ${oc.select:benchmark.fisher_seed,42}
  fisher_batch: 16
  require_deletion: ${oc.select:benchmark.methods.discrete.require_deletion,false}
  time_limit: 60.0
  gap: 0.01
  bound: 10.0
  log: false
label: discrete

# Shared by joint, joint_simple and singular; the meanings are documented in pruning/methods/kfac.py.
scope: global
replay: false
unit: both
affine: true
curvature: kfac
factor_backend: memory
objective: kl
compensation: full
target: model
trust: [1, 10, 100, 1000, 10000]
estimation:
  n: ${oc.select:benchmark.fisher_n,null}
  seed: ${oc.select:benchmark.fisher_seed,42}
  batch: 16
  likelihood: auto
  variance: 1.0
  a_damping: 0.01
  b_damping: 0.01
  causal: ${oc.select:benchmark.causal,false}
  confidence: 0.05
schedule:
  mode: progressive
  targets: null
  spacing: 0.05
  maximum: ${protocol.max_removed}
